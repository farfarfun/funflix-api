[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "funflix-api"
version = "1.0.13"
description = "funflix 的 HTTP API 服务：依赖 funflix 提供的领域逻辑，供 funflix-web 反代消费"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["media", "netdisk", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    # 下界由 funbuild 在每次发版前抬到当时最新的 funflix, 见 [tool.funbuild]
    "fastapi>=0.117.0",
    "uvicorn[standard]>=0.30",
    "itsdangerous>=2.0",
    # 数据库地址与 LLM 凭证都从这里读（透传给 funflix.base.config）
    "funsecret",
    "funflix>=1.0.13",
]
license-files = ["LICENSE"]

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
funflix-api = "funflix_api.cli:app"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funflix-api"
Releases = "https://github.com/farfarfun/funflix-api/releases"

[tool.funbuild]
# 每次发版前把这些依赖在上面 dependencies 里的版本下界抬到当时最新的已发布版本,
# 使其进入 wheel metadata —— 否则下游 `pip install -U funflix-api` 默认
# --upgrade-strategy only-if-needed, 已装的旧 funflix 满足旧下界就不会被升上来。
latest-packages = ["funflix"]

[tool.hatch.build.targets.wheel]
packages = ["src/funflix_api"]

[tool.setuptools]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
