[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "funflix-api"
version = "0.1.2"
description = "funflix 的 HTTP API 服务：依赖 funflix 提供的领域逻辑，供 funflix-web 反代消费"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["media", "netdisk", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    "funflix>=0.1.64",
    "fastapi>=0.117.0",
    "uvicorn[standard]>=0.30",
    "itsdangerous>=2.0",
    # 数据库地址与 LLM 凭证都从这里读（透传给 funflix.base.config）
    "funsecret",
]
license-files = ["LICENSE"]

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
funflix-api = "funflix_api.cli:app"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funflix-api"
Releases = "https://github.com/farfarfun/funflix-api/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/funflix_api"]

[tool.setuptools]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
